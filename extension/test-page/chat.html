<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat test page</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif; color: #0d0d0d; background: #fff; display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  main { display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  .banner { background: #f4f4f4; border-bottom: 1px solid #e5e5e5; padding: 8px 16px; font-size: 13px; color: #555; }
  .log { flex: 1; overflow: auto; padding: 24px max(16px, calc(50% - 360px)); }
  article { margin: 0 0 18px; }
  [data-message-author-role="user"] { margin-left: auto; max-width: 75%; width: fit-content; background: #f4f4f4; border-radius: 18px; padding: 10px 16px; white-space: pre-wrap; }
  [data-message-author-role="assistant"] { white-space: pre-wrap; }
  form { padding: 12px max(16px, calc(50% - 360px)) 24px; }
  .composer { display: flex; align-items: flex-end; gap: 8px; border: 1px solid #e5e5e5; border-radius: 26px; padding: 10px 10px 10px 18px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  #prompt-textarea { flex: 1; min-height: 24px; max-height: 200px; overflow: auto; outline: none; white-space: pre-wrap; }
  #prompt-textarea:empty::before { content: "Ask anything"; color: #8f8f8f; }
  button[data-testid="send-button"] { width: 36px; height: 36px; border-radius: 50%; border: 0; background: #0d0d0d; color: #fff; font-size: 18px; cursor: pointer; }
  aside { border-left: 1px solid #e5e5e5; background: #fafafa; padding: 16px; overflow: auto; font-size: 13px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #666; margin: 0 0 8px; }
  aside pre { white-space: pre-wrap; background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px; margin: 0 0 10px; font: 12px/1.5 Consolas, ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <div class="banner">Local test page. It copies ChatGPT's chat box markup (#prompt-textarea, send-button) so NOAI+ can be tried without an account. Nothing leaves this computer.</div>
  <div class="log" id="log"></div>
  <form id="form">
    <div class="composer">
      <div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Chat with the test assistant"></div>
      <button type="button" data-testid="send-button" aria-label="Send prompt">↑</button>
    </div>
  </form>
</main>
<aside>
  <h2>What this website received</h2>
  <div id="received"></div>
</aside>
<script>
  const box = document.getElementById('prompt-textarea');
  const log = document.getElementById('log');
  const received = document.getElementById('received');
  const add = (role, text) => {
    const a = document.createElement('article');
    a.setAttribute('data-message-author-role', role);
    a.textContent = text;
    log.append(a);
    log.scrollTop = log.scrollHeight;
    return a;
  };
  // A stand in for the model: it answers with whatever placeholders it was given.
  const reply = (text) => {
    const ph = [...new Set(text.match(/\[[A-Z]+_\d+\]/g) || [])];
    const person = ph.find((p) => p.startsWith('[PERSON'));
    const phone = ph.find((p) => p.startsWith('[PHONE'));
    const email = ph.find((p) => p.startsWith('[EMAIL'));
    const id = ph.find((p) => p.startsWith('[SAUDI_ID') || p.startsWith('[IQAMA') || p.startsWith('[ID'));
    const lines = ['Here is a short reply you can send:', '', `Dear ${person || 'colleague'},`, '', 'Thank you for your message. We have the renewal ready for signature.'];
    if (phone) lines.push(`I will call you on ${phone} tomorrow morning.`);
    if (email) lines.push(`The documents will go to ${email}.`);
    if (id) lines.push(`The file is under ID ${id}.`);
    lines.push('', 'Best regards');
    return lines.join('\n');
  };
  const send = () => {
    const text = box.innerText.trim();
    if (!text) return;
    const pre = document.createElement('pre');
    pre.textContent = text;
    received.prepend(pre);
    add('user', text);
    box.textContent = '';
    setTimeout(() => add('assistant', reply(text)), 500);
  };
  document.querySelector('[data-testid="send-button"]').addEventListener('click', send);
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>
</body>
</html>
